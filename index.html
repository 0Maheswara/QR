<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Warehouse QR Tools</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f3f5f9;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    width:95%;
    max-width:700px;
    background:#fff;
    padding:30px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,.08);
}

h1{
    text-align:center;
    color:#2563eb;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:30px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}

.card{
    background:#f8fafc;
    border:1px solid #ddd;
    border-radius:12px;
    padding:20px;
    text-align:center;
    transition:.25s;
}

.card:hover{
    transform:translateY(-4px);
    box-shadow:0 8px 18px rgba(0,0,0,.12);
}

.card h2{
    margin-bottom:10px;
    font-size:20px;
}

.card p{
    color:#666;
    font-size:14px;
    margin-bottom:20px;
}

.card a{
    display:inline-block;
    text-decoration:none;
    background:#2563eb;
    color:white;
    padding:10px 18px;
    border-radius:8px;
    font-weight:bold;
}

.card a:hover{
    background:#1d4ed8;
}

.footer{
    margin-top:30px;
    text-align:center;
    color:#888;
    font-size:13px;
}
</style>

</head>

<body>

<div class="container">

<h1>📦 Warehouse QR Tools</h1>

<p class="subtitle">
Choose the tool you want to use
</p>

<div class="grid">

<div class="card">
<h2>📦 Item QR Generator</h2>
<p>Create QR codes for individual items.</p>
<a href="QR_Code_Generator_for_Items_with_Date.html">Open</a>
</div>

<div class="card">
<h2>🗂 Bulk QR Generator</h2>
<p>Generate multiple QR codes from a list.</p>
<a href="Warehouse_Bulk_QR_Generator.html">Open</a>
</div>

<div class="card">
<h2>🗄️ 🛒 🏷 Bin Label QR Generator</h2>
<p>AISLE RACK BIN Labels</p>
<a href="QR_Code_Generator_for_bin_labels.html">Open</a>
</div>

</div>

<div class="footer">
Warehouse QR Toolkit
</div>

</div>

</body>
</html>
