<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Warehouse Bulk QR Generator</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #f4f6f8;
        }

        textarea {
            width: 100%;
            height: 140px;
        }

        table {
            width: 100%;
            margin-top: 15px;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 6px;
            text-align: center;
            border: 1px solid #ccc;
        }

        input[type="text"] {
            width: 100%;
            box-sizing: border-box;
        }

        canvas {
            width: 100px;
            height: 100px;
        }

        button {
            padding: 10px;
            margin: 5px;
            cursor: pointer;
        }

    </style>

</head>

<body>

    <h2>Warehouse Bulk QR Generator</h2>

    <p>Paste one number per line.</p>

    <textarea id="nums"></textarea>

    <br>

    <button onclick="build()">
        Generate Preview
    </button>

    <button onclick="downloadZip()">
        Download ZIP
    </button>

    <button onclick="downloadPDF()">
        Download PDF
    </button>

    <div id="tbl"></div>

    <script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <script>

    <!-- Your formatted JavaScript starts here -->

let rows = [];

function today() {
    let d = new Date();

    return String(d.getDate()).padStart(2, "0") + "-" +
           String(d.getMonth() + 1).padStart(2, "0") + "-" +
           d.getFullYear();
}

function build() {

    rows = [];

    let t = `
        <table>
            <tr>
                <th>#</th>
                <th>Number</th>
                <th>Edit QR Text</th>
                <th>QR</th>
            </tr>
    `;

    document.getElementById("tbl").innerHTML = "";

    let arr = document
        .getElementById("nums")
        .value
        .split(/\n/)
        .map(x => x.trim())
        .filter(Boolean)
        .slice(0, 100);

    arr.forEach((n, i) => {

        let txt = "b_" + n + "_" + today();

        t += `
            <tr>
                <td>${i + 1}</td>
                <td>${n}</td>

                <td>
                    <input
                        type="text"
                        value="${txt}"
                        oninput="upd(${i}, this.value)">
                </td>

                <td>
                    <div id="q${i}"></div>
                </td>
            </tr>
        `;

        rows.push({
            text: txt
        });

    });

    t += "</table>";

    document.getElementById("tbl").innerHTML = t;

    rows.forEach((r, i) => draw(i, r.text));

}

function draw(i, txt) {

    let div = document.getElementById("q" + i);

    div.innerHTML = "";

    new QRCode(div, {
        text: txt,
        width: 100,
        height: 100
    });

}

function upd(i, value) {

    rows[i].text = value;

    draw(i, value);

}

async function downloadZip() {

    if (!rows.length) {
        alert("Generate first");
        return;
    }

    const zip = new JSZip();

    for (let i = 0; i < rows.length; i++) {

        let canvas = document.querySelector("#q" + i + " canvas");

        zip.file(
            rows[i].text + ".png",
            canvas.toDataURL().split(",")[1],
            { base64: true }
        );

    }

    const blob = await zip.generateAsync({
        type: "blob"
    });

    const a = document.createElement("a");

    a.href = URL.createObjectURL(blob);
    a.download = "Warehouse_QRs.zip";

    a.click();

}

async function downloadPDF() {

    if (!rows.length) {
        alert("Generate first");
        return;
    }
    // Wait for QR canvases to finish rendering
    await new Promise(resolve => setTimeout(resolve, 300));

    const { jsPDF } = window.jspdf;

    const pdf = new jsPDF("p", "mm", "a4");

    const labelsPerPage = 10;

    const qrSize = 35;

    const startX = 15;
    const startY = 15;

    const colGap = 75;
    const rowGap = 52;

    let label = 0;

    for (let i = 0; i < rows.length; i++) {

        if (label === labelsPerPage) {

            pdf.addPage();

            label = 0;

        }

        const canvas = document.querySelector("#q" + i + " canvas");

        const img = canvas.toDataURL("image/png");

        const col = label % 2;
        const row = Math.floor(label / 2);

        const x = startX + col * colGap;
        const y = startY + row * rowGap;

        pdf.addImage(img, "PNG", x, y, qrSize, qrSize);

        pdf.setFont("helvetica", "normal");
        pdf.setFontSize(8);

        pdf.text(rows[i].text, x, y + qrSize + 4);

        label++;

    }

    pdf.save("Warehouse_QR_Labels.pdf");

}
         </script>

</body>

</html>
